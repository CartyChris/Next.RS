name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  e2e:
    name: examples (npm) + browser
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install example dependencies
        run: for e in react jsx three-game ai-chat arena; do (cd examples/$e && npm ci --no-audit --no-fund); done
      - run: cargo test --features e2e --test react
      - name: Type-check the arena against Forge's declarations
        working-directory: examples/arena
        run: mkdir -p .forge/types && cp ../../src/runtime/js/forge.d.ts .forge/types/ && npx tsc -p .
      - run: cargo build --release
      - name: Browser tests
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node smoke.mjs ../../target/release/forge
