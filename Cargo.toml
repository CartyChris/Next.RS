[package]
name = "nextrs"
version = "0.2.0"
authors = ["CartyChris <https://github.com/CartyChris>"]
edition = "2024"
rust-version = "1.87"
description = "Next.RS (Forge): a Rust-native React meta-framework. In-process Rolldown bundling, embedded QuickJS SSR, single-file HTML export."
license = "MIT"
repository = "https://github.com/CartyChris/Next.RS"
default-run = "forge"

[[bin]]
name = "forge"
path = "src/main.rs"

[features]
default = ["fetch", "mimalloc"]
# Outbound `fetch()` for loaders and API routes (allowlisted per capsule).
fetch = ["dep:reqwest"]
# Tests that need `npm install` in examples/ (React SSR, three.js bundle).
e2e = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
base64 = "0.22"
blake3 = "1"
brotli = "8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.3"
mimalloc = { version = "0.1", optional = true }
notify = "8"
oxc = { version = "=0.158.0", features = ["ast_visit"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
rolldown = "=1.3.2"
rolldown_common = "=1.3.2"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Optimized but quick to rebuild: `cargo build --profile fast` for benchmarking iterations.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
