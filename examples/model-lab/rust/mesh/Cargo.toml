[package]
name = "forge-procedural-mesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep this example independent when copied by `forge new --template models`.
[workspace]
